# TEMPORARY DIAGNOSTIC COPY. Never merge. Every step runs even after a failure
# (each keeps its own result, and the job still fails), evidence is always kept,
# the job may run 60 minutes, and the push trigger is removed, so the deploy job
# (whose condition needs a push to main) can never run.
name: CI and Pages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Run 3 measures only; run 2 (44833769606) holds the full matrix.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The image already holds the browsers and their system packages, so the job
    # never downloads from the Ubuntu mirrors. Its version must match the
    # Playwright version installed below. Running as the runner's user lets
    # Firefox start, because it refuses to run as root in another user's home.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit, session and publishing tests
        if: ${{ !cancelled() }}
        run: npm test
      # The game has no dependencies. Playwright is installed only for this check,
      # at a pinned version, and is not recorded in package.json.
      - name: Install Playwright
        if: ${{ !cancelled() }}
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Chromium and Firefox check, served as on Pages
        if: ${{ !cancelled() }}
        run: npm run test:browser
      - name: Development audio lab in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:audio:browser
      - name: Coyote voice in the audio lab
        if: ${{ !cancelled() }}
        run: npm run test:coyote:browser
      - name: Gameplay audio on the published files, and the fallback
        if: ${{ !cancelled() }}
        run: npm run test:gameplay-audio:browser
      - name: Previous-lap ghost in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:ghost:browser
      - name: Saved reference ghost, its storage and Options in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:reference-ghost:browser
      - name: Radio in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:radio:browser
      - name: Title screen and menus in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:menus:browser
      - name: Driving tutorial and Return to Title in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:tutorial:browser
      - name: Track choice and Switchback in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:tracks:browser
      - name: Voided-lap warnings and results in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:scoring:browser
      - name: Mocked controller in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:controller:browser
      - name: Local personal records in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:records:browser
      - name: Handling modes and practice pad in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:handling:browser
      - name: Gymkhana challenges and their records in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:gymkhana:browser
      - name: Gymkhana medals in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:medals:browser
      - name: Gameplay categories in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:categories:browser
      - name: Getaway mission in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:getaway:browser
      - name: Getaway Showmanship and impact audio in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:showmanship:browser
      - name: Getaway personal bests, reloads and storage failures in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:getaway-records:browser
      - name: Dockyard and Slalom Sprint in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:dockyard-slalom:browser
      - name: Wheelspin smoke, rubber and engine note in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:wheelspin:browser
      - name: Functional environments and collision messages in Chromium and Firefox
        if: ${{ !cancelled() }}
        run: npm run test:environment:browser
      - name: Keep every suite's evidence (diagnostic)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-artifacts
          path: artifacts/
          retention-days: 30


  options-geometry:
    # Diagnostic only: where the Options sheet's height goes in this container's Firefox and
    # Chromium, with the current CSS and with a proposed compact-spacing rule injected.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Fonts this container resolves
        run: |
          for f in "Trebuchet MS" "Segoe UI" Verdana sans-serif Impact Haettenschweiler "Arial Narrow Bold" "Liberation Sans Narrow" "DejaVu Sans Condensed"; do echo "$f -> $(fc-match "$f")"; done
      - name: Write the measurement script and the proposed CSS
        run: |
          mkdir -p artifacts/geometry/current artifacts/geometry/proposed
          cat > measure.mjs <<'MEASURE_EOF'
          // Measure the Options sheet the way reference-ghost-browser step 18 does, with an optional
          // Linux-like font emulation (DejaVu Sans for --body, DejaVu Sans Condensed for --poster/--display).
          // usage: node measure-options.mjs <repo root> [native|linux|both] [shotDir]
          import http from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { extname, join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const root = process.argv[2];
          const modes = (process.argv[3] ?? 'both') === 'both' ? ['native', 'linux'] : [process.argv[3]];
          const shotDir = process.argv[4];
          const { chromium, firefox } = await import('playwright');
          const types = { '.html': 'text/html', '.js': 'text/javascript', '.mjs': 'text/javascript', '.css': 'text/css', '.json': 'application/json', '.mp3': 'audio/mpeg', '.wav': 'audio/wav', '.ogg': 'audio/ogg', '.png': 'image/png' };
          const server = http.createServer(async (req, res) => {
            const path = decodeURIComponent(new URL(req.url, 'http://x').pathname).replace(/^\/mini-drifters\//, '/');
            const file = path.endsWith('/') ? path + 'index.html' : path;
            try { const body = await readFile(join(root, file)); res.writeHead(200, { 'content-type': types[extname(file)] ?? 'application/octet-stream' }); res.end(body); }
            catch { res.writeHead(404); res.end(); }
          });
          await new Promise((r) => server.listen(0, '127.0.0.1', r));
          const BASE = `http://127.0.0.1:${server.address().port}/mini-drifters/`;
          const EXTRA = process.env.EXTRA_CSS ? (await readFile(process.env.EXTRA_CSS, 'utf8')) : '';
          const LINUX = ':root{--body:"DejaVu Sans",sans-serif !important;--poster:"DejaVu Sans Condensed",sans-serif !important;--display:"DejaVu Sans Condensed",sans-serif !important}';
          const NOTE = 'Dockyard · Classic: saved reference, 0:29.57. Your best lap, 0:12.34, has no recording. It joins you from lap 2.';

          for (const [name, engine] of [['chromium', chromium], ['firefox', firefox]]) {
            const browser = await engine.launch();
            for (const mode of modes) {
              const page = await browser.newPage({ viewport: { width: 1024, height: 600 } });
              await page.goto(BASE);
              await page.waitForFunction(() => window.__miniDrifters, null, { timeout: 30000 });
              if (mode === 'linux') await page.addStyleTag({ content: LINUX });
              if (EXTRA) await page.addStyleTag({ content: EXTRA });
              await page.locator('#sound').click();
              for (const [width, height] of [[1024, 600], [1366, 768], [1920, 1080]]) {
                await page.setViewportSize({ width, height });
                await page.keyboard.press('KeyO');
                await page.waitForTimeout(120);
                const m = await page.evaluate((note) => {
                  const o = document.getElementById('options');
                  if (o.hidden) return { open: false };
                  document.getElementById('ghost-note').textContent = note;
                  const muted = document.getElementById('options-muted');
                  const sheet = o.querySelector('.sheet').getBoundingClientRect();
                  const parts = [...o.querySelectorAll('#options button, #options input, #ghost-sources span, #ghost-note, #options-muted')]
                    .filter((el) => el.getClientRects().length)
                    .flatMap((el) => {
                      const t = el.matches('input') ? el.closest('label') : el;
                      const r = t.getBoundingClientRect();
                      return r.left < 0 || r.top < 0 || r.right > innerWidth || r.bottom > innerHeight || (el.matches('span') && el.scrollWidth > el.clientWidth + 1)
                        ? [`${el.id || el.textContent?.slice(0, 20) || el.name} ${Math.round(r.top)}-${Math.round(r.bottom)}`] : [];
                    });
                  const close = document.getElementById('options-close').getBoundingClientRect();
                  const rows = [...o.querySelector('.sheet').children].map((c) => `${c.id || c.className || c.tagName}:${Math.round(c.getBoundingClientRect().top)}-${Math.round(c.getBoundingClientRect().bottom)}`);
                  return { open: true, muted: !muted.hidden, sheet: `${Math.round(sheet.top)}-${Math.round(sheet.bottom)} h${Math.round(sheet.height)}`, close: `${Math.round(close.top)}-${Math.round(close.bottom)}`, out: parts, rows: innerHeight === 600 ? rows : undefined };
                }, NOTE);
                console.log(`${name} ${mode} ${width}x${height}`, JSON.stringify(m));
                if (shotDir) await page.screenshot({ path: `${shotDir}/${name}-${mode}-${width}x${height}.png` });
                await page.keyboard.press('Escape');
                await page.waitForTimeout(80);
              }
              await page.close();
            }
            await browser.close();
          }
          server.close();
          MEASURE_EOF
          cat > proposed.css <<'CSS_EOF'
          @media (max-height: 620px) {
            #options .options-warning { margin-top: 6px; }
            #options h2 { margin: 10px 0 6px; }
            #options .options-section { margin-top: 10px; }
            #options .radio-note { margin: 6px 0 2px; }
            #options .ghost-note { margin-bottom: 0; }
            #options .volume { margin-top: 6px; }
            #options .actions button { margin-top: 12px; }
          }
          CSS_EOF
      - name: Options geometry with the current CSS
        run: node measure.mjs "$PWD" native artifacts/geometry/current
      - name: Options geometry with the proposed rule injected
        run: EXTRA_CSS=proposed.css node measure.mjs "$PWD" native artifacts/geometry/proposed
      - name: Keep the geometry evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: options-geometry
          path: artifacts/geometry/
          retention-days: 30

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site (only the files the game needs)
        run: |
          mkdir -p _site/audio-lab/assets/coyote-local
          cp -r index.html style.css src radio _site/
          cp audio-lab/assets/tire-foley.mp3 audio-lab/assets/ATTRIBUTION.md _site/audio-lab/assets/
          cp audio-lab/assets/coyote-local/idle.wav audio-lab/assets/coyote-local/mid.wav audio-lab/assets/coyote-local/load.wav audio-lab/assets/coyote-local/high.wav _site/audio-lab/assets/coyote-local/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
